# Called from a target repo's score.yml (see examples/score.yml). Grades every recorded implement run in
# <owner>/factory-runs that has a PR and is missing a score, and pushes scores/<runId>/<scorer>.json. The judges also grade
# bench cells with a stored diff, into scores/bench/<benchId>/<cell>/<scorer>.json.
# The secret split matches run.yml: the steps that talk to GitHub get FACTORY_GH_TOKEN (plus the model credentials,
# only to scrub them from what they push), and the step that runs judges gets model credentials only.
name: factory score

on:
  workflow_call:
    inputs:
      runner:
        description: JSON value for runs-on, such as '"ubuntu-latest"' or '["self-hosted", "factory"]'
        type: string
        default: '"ubuntu-latest"'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: false }
      ANTHROPIC_API_KEY: { required: false }
      DEEPSEEK_API_KEY: { required: false }
      FACTORY_GH_TOKEN: { required: true }

permissions:
  contents: read

jobs:
  score:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 120
    concurrency:
      group: factory-score-${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kenryu42/factory
          ref: main
          path: factory
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: ./factory/.github/actions/tools

      - run: echo "FACTORY_RUN_DIR=$RUNNER_TEMP/factory-score" >> "$GITHUB_ENV"

      - name: Prepare
        run: node factory/src/cli.ts score-prepare
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}

      - name: Judge
        run: node factory/src/cli.ts score-judge
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: always()
        name: Save
        run: node factory/src/cli.ts score-save
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
