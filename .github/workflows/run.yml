# Called from a target repo's factory.yml (see examples/factory.yml).
# Each step gets only the secrets it needs: steps that run an agent get model credentials, steps that talk to GitHub
# get FACTORY_GH_TOKEN (plus the model credentials, only to scrub them from what they post). An agent runs in a
# container that sees one model credential and nothing else. Every cli step after guard does nothing when its
# stage does not apply to the run, so the step list is the whole pipeline for every label.
name: factory run

on:
  workflow_call:
    inputs:
      runner:
        description: JSON value for runs-on, such as '"ubuntu-latest"' or '["self-hosted", "factory"]'
        type: string
        default: '"ubuntu-latest"'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: false }
      ANTHROPIC_API_KEY: { required: false }
      DEEPSEEK_API_KEY: { required: false }
      FACTORY_GH_TOKEN: { required: true }

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  run:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 240
    concurrency:
      # Issues and pull requests share one number sequence, so the two never collide.
      group: factory-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
    env:
      FACTORY_WORK_DIR: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kenryu42/factory
          ref: main
          path: factory
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: guard
        run: |
          echo "FACTORY_RUN_DIR=$RUNNER_TEMP/factory-run" >> "$GITHUB_ENV"
          FACTORY_RUN_DIR="$RUNNER_TEMP/factory-run" node factory/src/cli.ts guard
        env:
          GH_TOKEN: ${{ github.token }}

      # So that adding factory:revise again asks for another revision.
      - if: steps.guard.outputs.run == 'true' && github.event_name == 'pull_request_target'
        name: Remove the revise label
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/factory%3Arevise" --silent
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}

      # The default branch for an issue label; for factory:revise, the pull request's head as the guard read it from the API.
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.guard.outputs.ref }}
          path: work
          persist-credentials: false

      - if: steps.guard.outputs.run == 'true'
        uses: ./factory/.github/actions/tools

      - if: steps.guard.outputs.run == 'true'
        name: Preflight
        run: node factory/src/cli.ts preflight
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}

      - if: steps.guard.outputs.run == 'true'
        name: Agent
        run: node factory/src/cli.ts agent 0
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: always() && steps.guard.outputs.run == 'true'
        name: Publish
        run: node factory/src/cli.ts publish 0
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # No secrets: the build and the browser see only the published tree.
      - if: steps.guard.outputs.run == 'true'
        name: Visual QA
        run: node factory/src/cli.ts qa 0

      - if: steps.guard.outputs.run == 'true'
        name: Review
        run: node factory/src/cli.ts review 0
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: steps.guard.outputs.run == 'true'
        name: Respond
        run: node factory/src/cli.ts respond 0
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: steps.guard.outputs.run == 'true'
        name: Revise
        run: node factory/src/cli.ts agent 1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: always() && steps.guard.outputs.run == 'true'
        name: Publish revision
        run: node factory/src/cli.ts publish 1
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: steps.guard.outputs.run == 'true'
        name: Visual QA of revision
        run: node factory/src/cli.ts qa 1

      - if: steps.guard.outputs.run == 'true'
        name: Review revision
        run: node factory/src/cli.ts review 1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: steps.guard.outputs.run == 'true'
        name: Respond to revision
        run: node factory/src/cli.ts respond 1
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: always() && steps.guard.outputs.run == 'true'
        name: Record
        run: node factory/src/cli.ts record
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
