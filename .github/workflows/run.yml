# Called from a target repo's factory.yml (see examples/factory.yml).
# Each step gets only the secrets it needs: steps that run an agent get model credentials, steps that talk to GitHub
# get FACTORY_GH_TOKEN (plus the model credentials, only to scrub them from what they post). An agent runs in a
# container that sees one model credential and nothing else. Every cli step after guard does nothing when its
# stage does not apply to the run, so the step list is the whole pipeline for both labels.
name: factory run

on:
  workflow_call:
    inputs:
      runner:
        description: JSON value for runs-on, such as '"ubuntu-latest"' or '["self-hosted", "factory"]'
        type: string
        default: '"ubuntu-latest"'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: false }
      ANTHROPIC_API_KEY: { required: false }
      DEEPSEEK_API_KEY: { required: false }
      FACTORY_GH_TOKEN: { required: true }

permissions:
  contents: read
  issues: read

jobs:
  run:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 240
    concurrency:
      group: factory-${{ github.repository }}-${{ github.event.issue.number }}
    env:
      FACTORY_WORK_DIR: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kenryu42/factory
          ref: main
          path: factory
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: guard
        run: |
          echo "FACTORY_RUN_DIR=$RUNNER_TEMP/factory-run" >> "$GITHUB_ENV"
          FACTORY_RUN_DIR="$RUNNER_TEMP/factory-run" node factory/src/cli.ts guard
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          path: work
          persist-credentials: false

      - if: steps.guard.outputs.run == 'true'
        name: Install gitleaks
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) platform=linux_x64 sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            macOS-ARM64) platform=darwin_arm64 sum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            *) echo "No pinned gitleaks build for ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/gitleaks_8.30.1_$platform.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_$platform.tar.gz"
          echo "$sum  $archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - if: steps.guard.outputs.run == 'true'
        name: Build agent image
        run: docker build -q -t factory-agent factory/docker

      - if: steps.guard.outputs.run == 'true'
        name: Agent
        run: node factory/src/cli.ts agent 0
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: always() && steps.guard.outputs.run == 'true'
        name: Publish
        run: node factory/src/cli.ts publish 0
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: steps.guard.outputs.run == 'true'
        name: Review
        run: node factory/src/cli.ts review 0
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: steps.guard.outputs.run == 'true'
        name: Respond
        run: node factory/src/cli.ts respond 0
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: steps.guard.outputs.run == 'true'
        name: Revise
        run: node factory/src/cli.ts agent 1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: always() && steps.guard.outputs.run == 'true'
        name: Publish revision
        run: node factory/src/cli.ts publish 1
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: steps.guard.outputs.run == 'true'
        name: Review revision
        run: node factory/src/cli.ts review 1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: steps.guard.outputs.run == 'true'
        name: Respond to revision
        run: node factory/src/cli.ts respond 1
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - if: always() && steps.guard.outputs.run == 'true'
        name: Record
        run: node factory/src/cli.ts record
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
