<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Factory runs</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6b66;
    --line: #e4e3df;
    --accent: #2f5fb3;
    --bar: #9db3d9;
    --code: #f1f0ec;
    --ok: #2e7d4f;
    --warn: #a16207;
    --bad: #b42318;
    --merged: #6941c6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --panel: #1f1f1e;
      --text: #e8e7e3;
      --muted: #9a9993;
      --line: #33332f;
      --accent: #8ab0f0;
      --bar: #3d5a8c;
      --code: #2a2a28;
      --ok: #6fcf97;
      --warn: #e3b341;
      --bad: #f28b82;
      --merged: #b69cf6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .tile .label { color: var(--muted); font-size: 12px; }
  .tile .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .breakdowns { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 12px; margin-bottom: 24px; }
  .bars td { padding: 3px 0; }
  .bars td:first-child { padding-right: 12px; white-space: nowrap; }
  .bars td:nth-child(2) { width: 100%; }
  .bars td.num { padding-left: 12px; }
  .bar { height: 8px; border-radius: 4px; background: var(--bar); }
  table { border-collapse: collapse; width: 100%; }
  .filters { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .runs th, .runs td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  .runs th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel); position: sticky; top: 0; }
  .runs th.num, .runs td.num { text-align: right; }
  .runs tbody tr { cursor: pointer; }
  .runs tbody tr:hover { background: var(--code); }
  .runs tbody tr:last-child td { border-bottom: 0; }
  .runs tbody tr.selected { background: var(--code); }
  .stages { margin-bottom: 16px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .pill { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; border: 1px solid currentColor; }
  .s-pr_opened, .s-spec_posted, .s-proposed, .o-open, .v-approve { color: var(--ok); }
  .s-no_changes, .s-no_change, .o-closed { color: var(--muted); }
  .s-agent_failed, .s-publish_failed, .o-reverted { color: var(--bad); }
  .s-blocked_secret, .s-blocked_workflow_change, .s-blocked_scope, .v-request_changes { color: var(--warn); }
  .o-merged { color: var(--merged); }
  .back { display: inline-block; margin-bottom: 12px; }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 16px; margin-bottom: 16px; }
  .meta .label { display: block; color: var(--muted); font-size: 12px; }
  .steps { display: flex; flex-direction: column; gap: 10px; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .step.message { white-space: pre-wrap; overflow-wrap: anywhere; }
  .step.call { margin-left: 24px; }
  .step.result { margin-left: 48px; padding: 6px 14px; }
  .step.result.error { border-color: var(--bad); }
  .step .kind { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .step .kind b { color: var(--text); font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-weight: 600; }
  .step.error .kind { color: var(--bad); }
  pre { margin: 0; padding: 8px 10px; background: var(--code); border-radius: 6px; font: 12px/1.45 ui-monospace, 'SF Mono', Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  button.more { margin-top: 4px; font: inherit; font-size: 12px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .notice { padding: 16px; color: var(--muted); }
  .sc-pass { color: var(--ok); }
  .sc-fail { color: var(--bad); }
  .sc-unknown { color: var(--muted); }
  section { margin-top: 28px; }
  .grid { width: auto; }
  .grid th, .grid td { padding: 4px 12px 4px 0; text-align: left; white-space: nowrap; }
  .grid th { font-size: 12px; font-weight: 600; color: var(--muted); }
  .grid td.num, .grid th.num { text-align: right; }
  .missed { color: var(--bad); font-weight: 600; }
  .up { color: var(--ok); }
  .grid tr.group td { border-top: 1px solid var(--line); padding-top: 6px; }
  .down { color: var(--bad); }
  .scores { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .score-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
  .chart { width: 100%; max-width: 560px; height: auto; display: block; margin-top: 12px; }
  .chart .axis { stroke: var(--line); }
  .chart .tick { fill: var(--muted); font-size: 11px; }
  .chart .dot { fill: var(--panel); stroke: var(--muted); stroke-width: 1.5; }
  .chart .dot.front { fill: var(--accent); stroke: var(--accent); }
  .chart .front-line { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .chart .name { fill: var(--text); font-size: 11px; }
</style>
</head>
<body>
<main id="app"></main>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
  const data = JSON.parse(document.getElementById('report-data').textContent)
  const rows = data.rows.slice().sort((a, b) => b.startedAt.localeCompare(a.startedAt))
  const app = document.getElementById('app')
  const filters = { kind: '', harness: '', status: '' }

  function h(tag, attrs, ...children) {
    const el = document.createElement(tag)
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
      else el.setAttribute(k, v)
    }
    for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c)
    return el
  }
  const link = (href, text) => (/^https:\/\//.test(href || '') ? h('a', { href, target: '_blank', rel: 'noopener', onclick: (e) => e.stopPropagation() }, text) : text)
  const usd = (n) => (n === null || n === undefined ? 'n/a' : '$' + n.toFixed(n !== 0 && Math.abs(n) < 1 ? 4 : 2))
  const date = (iso) => iso.slice(0, 16).replace('T', ' ')
  const dur = (s) => (s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m` : s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`)
  const label = (s) => s.replace(/_/g, ' ')
  const issueNumber = (r) => (r.trigger.match(/^issue#(\d+)$/) || [])[1]
  const prNumber = (url) => (url ? '#' + url.split('/').pop() : '')
  const pill = (cls, text) => h('span', { class: 'pill ' + cls }, text)
  const verdict = (v) => (v ? pill('v-' + v, label(v)) : h('span', { class: 'muted' }, 'none'))
  const pct = (x) => (x === null || x === undefined ? 'n/a' : Math.round(x * 100) + '%')
  const scoreWord = (p) => (p === null ? 'unknown' : p ? 'pass' : 'fail')
  const scorePill = (s, hover) => (s ? h('span', { class: 'pill sc-' + scoreWord(s.pass), title: hover ? s.reason : null }, scoreWord(s.pass)) : '')
  const scoresOf = (id) => data.scores.filter((s) => s.subject.kind === 'run' && s.subject.runId === id).sort((a, b) => Number(b.scorer === 'correctness') - Number(a.scorer === 'correctness') || a.scorer.localeCompare(b.scorer))
  const stageKey = (s) => `${s.agent}-${s.round}`
  const stageHref = (r, s) => '#run=' + encodeURIComponent(r.id) + '&stage=' + encodeURIComponent(stageKey(s))

  function issueLink(r) {
    const n = issueNumber(r)
    return n ? link(`https://github.com/${r.repo}/issues/${n}`, `${r.repo}#${n}`) : `${r.repo} ${r.trigger}`
  }

  function tile(lbl, value) {
    return h('div', { class: 'panel tile' }, h('div', { class: 'label' }, lbl), h('div', { class: 'value' }, value))
  }

  function bars(title, entries, fmt) {
    const max = Math.max(...entries.map(([, v]) => v)) || 1
    return h('div', { class: 'panel' }, h('h2', {}, title), h('table', { class: 'bars' }, h('tbody', {},
      entries.map(([name, v, shown]) => h('tr', {},
        h('td', {}, name),
        h('td', {}, h('div', { class: 'bar', style: `width:${(v / max) * 100}%` })),
        h('td', { class: 'num' }, shown ?? fmt(v)))))))
  }

  function summaryView() {
    const s = data.summary
    const avg = s.avgHumanTouches === null ? 'n/a' : s.avgHumanTouches.toFixed(1)
    return [
      h('div', { class: 'tiles' },
        tile('Runs', String(s.runs)),
        tile('PRs opened', String(s.prsOpened)),
        tile('Total cost', usd(s.totalCostUsd)),
        tile('Cost per PR', usd(s.costPerPrUsd)),
        tile('Merged', String(s.merged)),
        tile('Reverted', String(s.reverted)),
        tile('Touches per PR', avg)),
      h('div', { class: 'breakdowns' },
        bars('Runs by status', Object.entries(s.byStatus).sort((a, b) => b[1] - a[1]).map(([k, v]) => [label(k), v]), String),
        bars('Spend by harness', Object.entries(s.byHarness).map(([k, v]) => [k, v.costUsd ?? 0, `${usd(v.costUsd)} · ${v.runs} run${v.runs === 1 ? '' : 's'}`]), usd)),
    ]
  }

  function select(key, values, all) {
    return h('select', { onchange: (e) => { filters[key] = e.target.value; renderTable() } },
      h('option', { value: '' }, all),
      values.map((v) => h('option', { value: v, selected: filters[key] === v ? '' : null }, label(v))))
  }

  const tbody = h('tbody')
  const count = h('span', { class: 'muted' })

  function renderTable() {
    const shown = rows.filter((r) => Object.entries(filters).every(([k, v]) => !v || r[k] === v))
    count.textContent = `${shown.length} of ${rows.length} runs`
    tbody.replaceChildren(...(shown.length ? shown.map((r) => h('tr', { onclick: () => { location.hash = 'run=' + encodeURIComponent(r.id) } },
      h('td', { style: 'font-variant-numeric:tabular-nums' }, date(r.startedAt)),
      h('td', {}, issueLink(r)),
      h('td', {}, r.kind),
      h('td', {}, r.harness),
      h('td', { class: 'muted' }, r.model),
      h('td', {}, pill('s-' + r.status, label(r.status))),
      h('td', {}, r.kind === 'implement' ? verdict(r.verdict) : ''),
      h('td', {}, scorePill(scoresOf(r.id).find((s) => s.scorer === 'correctness'), true)),
      h('td', {}, judgesCell(r.id)),
      h('td', {}, r.outcome ? pill('o-' + r.outcome, r.outcome) : h('span', { class: 'muted' }, r.prUrl ? 'unknown' : '')),
      h('td', { class: 'num' }, r.humanTouches === null ? '' : String(r.humanTouches)),
      h('td', { class: 'num' }, usd(r.costUsd)),
      h('td', { class: 'num' }, dur(r.wallTimeS)),
      h('td', {}, r.prUrl ? link(r.prUrl, prNumber(r.prUrl)) : ''))) : [h('tr', {}, h('td', { colspan: 14, class: 'empty' }, 'No runs match these filters.'))]))
  }

  function listView() {
    const uniq = (key) => [...new Set(rows.map((r) => r[key]))].sort()
    renderTable()
    return [
      ...summaryView(),
      h('div', { class: 'filters' }, select('kind', uniq('kind'), 'All kinds'), select('harness', uniq('harness'), 'All harnesses'), select('status', uniq('status'), 'All statuses'), count),
      h('div', { class: 'table-wrap' }, h('table', { class: 'runs' },
        h('thead', {}, h('tr', {}, ['Started', 'Issue', 'Kind', 'Harness', 'Model', 'Status', 'Verdict', 'Correct', 'Judges', 'Outcome', 'Touches', 'Cost', 'Wall time', 'PR']
          .map((t) => h('th', { class: ['Touches', 'Cost', 'Wall time'].includes(t) ? 'num' : null }, t)))),
        tbody)),
      ...scoresSection(),
      ...benchSection(),
      ...compareSection(),
      ...improvementsSection(),
    ]
  }

  function judgesCell(id) {
    const judged = scoresOf(id).filter((s) => s.scorer !== 'correctness')
    if (!judged.length) return ''
    const passed = judged.filter((s) => s.pass).length
    return h('span', { title: judged.map((s) => `${s.scorer}: ${scoreWord(s.pass)}`).join('\n'), class: passed === judged.length ? 'sc-pass' : 'sc-fail' }, `${passed}/${judged.length}`)
  }

  function grid(head, body) {
    return h('table', { class: 'grid' }, h('thead', {}, h('tr', {}, head.map(([t, cls]) => h('th', { class: cls || null }, t)))), h('tbody', {}, body))
  }

  function scoresSection() {
    if (!data.scoreSummary.length) return []
    const harnesses = Object.keys(data.scoreSummary[0].byHarness)
    const rate = (t) => {
      const graded = t.pass + t.fail
      if (!graded && !t.unknown) return h('span', { class: 'muted' }, '-')
      return [graded ? `${t.pass}/${graded} · ${pct(t.pass / graded)}` : 'n/a', t.unknown ? h('span', { class: 'muted' }, ` (+${t.unknown} unknown)`) : '']
    }
    const c = data.calibration
    const cell = (n, missed) => h('td', { class: 'num' + (missed && n ? ' missed' : '') }, String(n))
    return [h('section', {}, h('h2', {}, 'Scores'), h('div', { class: 'breakdowns' },
      h('div', { class: 'panel' }, h('h2', {}, 'Pass rate by implement harness'),
        grid([['Scorer'], ...harnesses.map((x) => [x])], data.scoreSummary.map((s) => h('tr', {}, h('td', {}, s.scorer), harnesses.map((x) => h('td', {}, rate(s.byHarness[x]))))))),
      h('div', { class: 'panel' }, h('h2', {}, 'Review calibration'),
        grid([['Final verdict'], ['Correct', 'num'], ['Wrong', 'num']], [
          h('tr', {}, h('td', {}, verdict('approve')), cell(c.approve.correct), cell(c.approve.wrong, true)),
          h('tr', {}, h('td', {}, verdict('request_changes')), cell(c.request_changes.correct), cell(c.request_changes.wrong)),
        ]),
        h('p', { class: 'muted', style: 'margin:8px 0 0;font-size:12px' }, 'Runs with a final review verdict and a correctness score. Approve and wrong is a defect the review missed.'))))]
  }

  const SVG = 'http://www.w3.org/2000/svg'
  function svgEl(tag, attrs, text) {
    const el = document.createElementNS(SVG, tag)
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v)
    if (text !== undefined) el.textContent = text
    return el
  }

  // Pass rate against average cost per task. The frontier configs are the ones no other config beats on both.
  function scatter(configs) {
    const pts = configs.filter((c) => c.avgCostUsd !== null && c.passRate !== null)
    const W = 520, H = 260, L = 44, R = 28, T = 20, B = 34
    const maxX = Math.max(...pts.map((c) => c.avgCostUsd), 0) * 1.15 || 1
    const x = (v) => L + (v / maxX) * (W - L - R)
    const y = (v) => T + (1 - v) * (H - T - B)
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': 'Pass rate against average cost per task' })
    svg.append(svgEl('line', { x1: L, y1: y(0), x2: W - R, y2: y(0), class: 'axis' }), svgEl('line', { x1: L, y1: T, x2: L, y2: y(0), class: 'axis' }))
    for (const v of [0, 0.5, 1]) {
      svg.append(svgEl('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end', class: 'tick' }, pct(v)))
      svg.append(svgEl('text', { x: x(v * maxX), y: H - B + 16, 'text-anchor': v === 1 ? 'end' : 'middle', class: 'tick' }, usd(v * maxX)))
    }
    svg.append(svgEl('text', { x: (L + W - R) / 2, y: H - 4, 'text-anchor': 'middle', class: 'tick' }, 'avg cost per task'))
    const front = pts.filter((c) => c.pareto).sort((a, b) => a.avgCostUsd - b.avgCostUsd)
    if (front.length > 1) svg.append(svgEl('polyline', { points: front.map((c) => `${x(c.avgCostUsd)},${y(c.passRate)}`).join(' '), class: 'front-line' }))
    // Labels sit above their dot and move down past any label already placed where they would overlap.
    const placed = []
    for (const c of pts.slice().sort((a, b) => b.passRate - a.passRate || a.avgCostUsd - b.avgCostUsd)) {
      const cx = x(c.avgCostUsd), cy = y(c.passRate)
      const dot = svgEl('circle', { cx, cy, r: 5, class: 'dot' + (c.pareto ? ' front' : '') })
      dot.append(svgEl('title', {}, `${c.harness}:${c.model}\npass ${pct(c.passRate)}, ${usd(c.avgCostUsd)} per task`))
      const name = `${c.harness}:${c.model}`
      const width = name.length * 6.2
      const right = cx + 8 + width < W
      const x0 = right ? cx + 8 : cx - 8 - width
      let ly = cy - 7
      while (placed.some((p) => Math.abs(p.y - ly) < 13 && p.x0 < x0 + width && x0 < p.x0 + p.width)) ly += 13
      placed.push({ x0, y: ly, width })
      svg.append(dot, svgEl('text', { x: right ? cx + 8 : cx - 8, y: ly, 'text-anchor': right ? 'start' : 'end', class: 'name' }, name))
    }
    return svg
  }

  const rateOf = (t) => (t.pass + t.fail ? t.pass / (t.pass + t.fail) : null)
  function tallyCell(t) {
    if (!t || !(t.pass + t.fail + t.unknown)) return h('span', { class: 'muted' }, '-')
    const graded = t.pass + t.fail
    return [graded ? `${pct(rateOf(t))} (${t.pass}/${graded})` : 'n/a', t.unknown ? h('span', { class: 'muted' }, ` +${t.unknown} unknown`) : '']
  }

  function benchSection() {
    if (!data.bench.length) return []
    return [h('section', {}, h('h2', {}, 'Benchmarks'), data.bench.map((b) => {
      const judges = [...new Set(b.configs.flatMap((c) => Object.keys(c.judges)))].sort()
      return h('div', { class: 'panel', style: 'margin-bottom:12px' },
        h('div', { class: 'score-head' }, h('b', {}, `bench ${b.benchId}`),
          h('span', { class: 'muted' }, `implement.md at ${b.factoryRef} (${b.factorySha.slice(0, 7)}) · base ${b.baseSha.slice(0, 7)} · ${date(b.at)}`)),
        h('div', {},
          h('div', { style: 'overflow-x:auto' }, grid([['Config'], ['Tasks', 'num'], ['Correct', 'num'], ...judges.map((j) => [j, 'num']), ['Avg cost', 'num'], ['Avg time', 'num'], ['Frontier']],
            b.configs.slice().sort((p, q) => (q.passRate ?? -1) - (p.passRate ?? -1) || (p.avgCostUsd ?? 0) - (q.avgCostUsd ?? 0)).map((c) => h('tr', {},
              h('td', {}, `${c.harness}:${c.model}`),
              h('td', { class: 'num' }, String(c.tasks)),
              h('td', { class: 'num' }, pct(c.passRate)),
              judges.map((j) => h('td', { class: 'num' }, tallyCell(c.judges[j]))),
              h('td', { class: 'num' }, usd(c.avgCostUsd)),
              h('td', { class: 'num' }, dur(Math.round(c.avgWallTimeS))),
              h('td', {}, c.pareto ? pill('sc-pass', 'frontier') : ''))))),
          scatter(b.configs)))
    }))]
  }

  // A delta in percentage points, colored by whether B is better. For cost, lower is better.
  function delta(d, fmt, lowerIsBetter) {
    if (d === null) return h('span', { class: 'muted' }, 'n/a')
    const better = lowerIsBetter ? d < 0 : d > 0
    return h('span', { class: d === 0 ? 'muted' : better ? 'up' : 'down' }, (d > 0 ? '+' : d < 0 ? '−' : '±') + fmt(Math.abs(d)))
  }
  const side = (x) => `${x.factoryRef} (${x.factorySha.slice(0, 7)}) · bench ${x.benchId}`

  function compareSection() {
    if (!data.comparisons.length) return []
    return [h('section', {}, h('h2', {}, 'Bench comparisons'), data.comparisons.map((cmp) => h('div', { class: 'panel', style: 'margin-bottom:12px' },
      h('div', { class: 'score-head' }, h('b', {}, 'A'), h('span', {}, side(cmp.a)), h('b', {}, 'B'), h('span', {}, side(cmp.b))),
      h('p', { class: 'muted', style: 'margin:0 0 8px;font-size:12px' }, 'Pass rates over the tasks both benches ran under each config. Unknown scores are left out of the rate.'),
      h('div', { style: 'overflow-x:auto' }, grid([['Config'], ['Tasks', 'num'], ['Scorer'], ['A', 'num'], ['B', 'num'], ['B − A', 'num']],
        cmp.configs.flatMap((c) => [
          ...c.metrics.map((m, i) => h('tr', { class: i === 0 ? 'group' : null },
            h('td', {}, i === 0 ? `${c.harness}:${c.model}` : ''),
            h('td', { class: 'num' }, i === 0 ? String(c.tasks) : ''),
            h('td', {}, m.scorer),
            h('td', { class: 'num' }, tallyCell(m.a)),
            h('td', { class: 'num' }, tallyCell(m.b)),
            h('td', { class: 'num' }, delta(m.delta, (x) => Math.round(x * 100) + ' pts')))),
          h('tr', {},
            h('td', {}), h('td', {}), h('td', { class: 'muted' }, 'avg cost'),
            h('td', { class: 'num' }, usd(c.avgCostUsd.a)),
            h('td', { class: 'num' }, usd(c.avgCostUsd.b)),
            h('td', { class: 'num' }, delta(c.avgCostUsd.a === null || c.avgCostUsd.b === null ? null : c.avgCostUsd.b - c.avgCostUsd.a, usd, true))),
        ]))))))]
  }

  function improvementsSection() {
    if (!data.improvements.length) return []
    return [h('section', {}, h('h2', {}, 'Improvements'), h('div', { class: 'table-wrap' }, grid(
      [['Date'], ['Id'], ['Status'], ['Summary'], ['Changed files'], ['Cost', 'num'], ['Agent and evidence']],
      data.improvements.map((i) => h('tr', {},
        h('td', { style: 'font-variant-numeric:tabular-nums;white-space:nowrap' }, date(i.at)),
        h('td', { style: 'white-space:nowrap' }, i.id),
        h('td', {}, pill('s-' + i.status, label(i.status))),
        h('td', { style: 'white-space:normal;min-width:240px' }, i.headline ?? h('span', { class: 'muted' }, 'none')),
        h('td', {}, i.changedFiles.length ? i.changedFiles.map((f) => h('div', {}, h('code', {}, f))) : h('span', { class: 'muted' }, 'none')),
        h('td', { class: 'num' }, usd(i.costUsd)),
        h('td', { class: 'muted', style: 'white-space:normal;min-width:200px' },
          `${i.harness} (${i.model}) read ${i.basis.runs} runs, ${i.basis.failingScores} of ${i.basis.scores} scores failing${i.basis.benches.length ? `, ${i.basis.benches.length} benchmarks` : ''}`))))))]
  }

  // tail shows the last lines while collapsed, for output whose end matters, such as a test summary.
  function clamped(text, tail) {
    const lines = text.split('\n')
    if (lines.length <= 8 && text.length <= 600) return h('pre', {}, text)
    const short = tail ? lines.slice(-8).join('\n').slice(-600) : lines.slice(0, 8).join('\n').slice(0, 600)
    const pre = h('pre', {}, short)
    let open = false
    const btn = h('button', { class: 'more', type: 'button', onclick: () => {
      open = !open
      pre.textContent = open ? text : short
      btn.textContent = open ? 'Show less' : `Show all ${lines.length} lines`
    } }, `Show all ${lines.length} lines`)
    return [pre, btn]
  }

  function stepView(s) {
    if (s.kind === 'message') return h('div', { class: 'step message' }, s.text)
    if (s.kind === 'tool_call') return h('div', { class: 'step call' }, h('div', { class: 'kind' }, 'Tool call ', h('b', {}, s.tool)), h('pre', {}, s.input))
    return h('div', { class: 'step result' + (s.isError ? ' error' : '') }, h('div', { class: 'kind' }, s.isError ? 'Error' : 'Result'), clamped(s.output || '(no output)'))
  }

  function stagesView(r, selected) {
    const head = ['Stage', 'Harness', 'Model', 'Billing', 'Result', 'Verdict', 'Cost', 'Wall time', 'Transcript']
    return h('div', { class: 'table-wrap stages' }, h('table', { class: 'runs' },
      h('thead', {}, h('tr', {}, head.map((t) => h('th', { class: ['Cost', 'Wall time'].includes(t) ? 'num' : null }, t)))),
      h('tbody', {}, r.stages.map((s) => h('tr', { class: stageKey(s) === selected ? 'selected' : null, onclick: () => { location.hash = stageHref(r, s).slice(1) } },
        h('td', {}, `${s.agent} · round ${s.round}`),
        h('td', {}, s.harness),
        h('td', { class: 'muted' }, s.model),
        h('td', {}, s.billing),
        h('td', {}, s.ok ? 'ok' : pill('s-agent_failed', 'failed')),
        h('td', {}, s.agent === 'review' ? verdict(s.verdict) : ''),
        h('td', { class: 'num' }, usd(s.usage.costUsd)),
        h('td', { class: 'num' }, dur(s.wallTimeS)),
        h('td', {}, s.transcript === 'stored' ? 'stored' : h('span', { class: 'muted' }, 'withheld')))))))
  }

  function transcriptView(r, stage) {
    if (!stage) return [h('div', { class: 'panel notice' }, 'This run has no stages.')]
    const steps = (data.steps[r.id] || {})[stageKey(stage)]
    const title = h('h2', {}, `${stage.agent} · round ${stage.round} transcript`)
    if (steps) return [title, h('div', { class: 'steps' }, steps.length ? steps.map(stepView) : h('div', { class: 'panel notice' }, 'The transcript has no messages or tool calls.'))]
    return [title, h('div', { class: 'panel notice' }, stage.transcript === 'withheld'
      ? 'The transcript was withheld because it still looked like it held a secret after scrubbing.'
      : 'The transcript file is missing from this checkout.')]
  }

  function scoresView(r) {
    const mine = scoresOf(r.id)
    if (!mine.length) return ''
    return h('div', { class: 'scores' }, h('h2', {}, 'Scores'), mine.map((sc) => h('div', { class: 'panel' },
      h('div', { class: 'score-head' }, h('b', {}, sc.scorer), scorePill(sc),
        h('span', { class: 'muted' }, sc.judge ? `${sc.judge.harness} (${sc.judge.model}) · ${usd(sc.judge.costUsd)} · ${dur(sc.judge.wallTimeS)}` : 'deterministic check'),
        h('span', { class: 'muted' }, `graded ${sc.sha.slice(0, 7)}`)),
      clamped(sc.reason, !sc.judge))))
  }

  function runView(id, key) {
    const r = rows.find((x) => x.id === id)
    const back = h('a', { class: 'back', href: '#' }, '← All runs')
    if (!r) return [back, h('div', { class: 'panel notice' }, `No run with id ${id}.`)]
    const stage = r.stages.find((s) => stageKey(s) === key) || r.stages[0]
    const field = (name, value) => h('div', {}, h('span', { class: 'label' }, name), value)
    return [
      back,
      h('div', { class: 'panel', style: 'margin-bottom:16px' },
        h('h1', { style: 'margin-bottom:12px' }, issueLink(r), h('span', { class: 'muted', style: 'font-weight:400' }, `  run ${r.id}`)),
        h('div', { class: 'meta' },
          field('Started', date(r.startedAt)),
          field('Kind', r.task ? `${r.kind} · task ${r.task}` : r.kind),
          field('Harness', `${r.harness} (${r.model})`),
          field('Status', pill('s-' + r.status, label(r.status))),
          field('Final verdict', r.kind === 'implement' ? verdict(r.verdict) : 'n/a'),
          field('Outcome', r.outcome ? pill('o-' + r.outcome, r.outcome) : r.prUrl ? 'unknown' : 'no PR'),
          field('Human touches', r.humanTouches === null ? 'n/a' : String(r.humanTouches)),
          field('Cost', usd(r.costUsd)),
          field('Tokens in / cached / out', h('span', { style: 'font-variant-numeric:tabular-nums' }, `${r.inputTokens.toLocaleString()} / ${r.cacheReadTokens.toLocaleString()} / ${r.outputTokens.toLocaleString()}`)),
          field('Wall time', dur(r.wallTimeS)),
          field('Pull request', r.prUrl ? link(r.prUrl, prNumber(r.prUrl)) : 'none'),
          field('Run log', link(r.runUrl, /^https:\/\//.test(r.runUrl) ? 'GitHub Actions' : r.runUrl)))),
      scoresView(r),
      stagesView(r, stage && stageKey(stage)),
      ...transcriptView(r, stage),
    ]
  }

  function route() {
    const params = new URLSearchParams(location.hash.slice(1))
    const id = params.get('run')
    app.replaceChildren(
      h('header', {}, h('h1', {}, 'Factory runs'), h('span', { class: 'muted' }, `Generated ${date(data.generatedAt)} UTC`)),
      ...(id ? runView(id, params.get('stage')) : listView()))
    window.scrollTo(0, 0)
  }

  window.addEventListener('hashchange', route)
  route()
</script>
</body>
</html>
