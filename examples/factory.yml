# Copy to .github/workflows/factory.yml in any repo the factory should work on.
# Then add the FACTORY_GH_TOKEN secret and at least one model credential to that repo.
name: factory

on:
  issues:
    types: [labeled]
  # Labels on pull requests arrive as pull_request events, not issues events.
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  factory:
    if: >-
      (github.event_name == 'issues' && (github.event.label.name == 'factory' || github.event.label.name == 'factory:spec')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'factory:revise')
    uses: kenryu42/factory/.github/workflows/run.yml@main
    # Runs on GitHub-hosted runners. To run on your own Mac instead, uncomment the two lines below,
    # but only in repos where you alone can open pull requests.
    # with:
    #   runner: '["self-hosted", "factory"]'
    secrets: inherit
