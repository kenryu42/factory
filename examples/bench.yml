# Copy to .github/workflows/bench.yml in the repo the bench tasks were written for (kenryu42/factory-sandbox).
# Replays bench tasks across harness:model configs without opening issues or pull requests.
name: factory bench

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Comma-separated bench task ids, or all
        default: all
      configs:
        description: Comma-separated harness:model pairs
        default: claude-code:haiku,pi:deepseek/deepseek-v4-flash
      factory_ref:
        description: The kenryu42/factory ref whose implement agent is benchmarked
        default: main
      bench_id:
        description: Results directory name (default the run id)
        default: ''

permissions:
  contents: read

jobs:
  bench:
    uses: kenryu42/factory/.github/workflows/bench.yml@main
    with:
      tasks: ${{ inputs.tasks }}
      configs: ${{ inputs.configs }}
      factory_ref: ${{ inputs.factory_ref }}
      bench_id: ${{ inputs.bench_id }}
      # runner: '["self-hosted", "factory"]'
    secrets: inherit
