# Copy to .github/workflows/bench.yml in a repo that has bench tasks (.factory/bench/tasks/*/task.md on its default branch),
# such as kenryu42/factory-sandbox or kenryu42/next-step-japan.
# Replays the repo's bench tasks across harness:model configs without opening issues or pull requests.
name: factory bench

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Comma-separated ids of this repo's bench tasks, or all
        default: all
      configs:
        description: Comma-separated harness:model pairs
        default: claude-code:opus,claude-code:sonnet,pi:deepseek/deepseek-flash
      factory_ref:
        description: The kenryu42/factory ref whose implement agent is benchmarked
        default: main
      bench_id:
        description: Results directory name (default the run id)
        default: ''

permissions:
  contents: read

jobs:
  bench:
    uses: kenryu42/factory/.github/workflows/bench.yml@main
    with:
      tasks: ${{ inputs.tasks }}
      configs: ${{ inputs.configs }}
      factory_ref: ${{ inputs.factory_ref }}
      bench_id: ${{ inputs.bench_id }}
      # Self-hosted Mac, as next-step-japan's factory.yml uses. Only in repos where you alone can open pull requests.
      runner: '["self-hosted", "factory"]'
    secrets: inherit
